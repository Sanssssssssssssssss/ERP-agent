[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "erp-harness"
version = "0.5.4"
description = "Native ERP agent runtime and desktop backend"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "docs/licenses/*"]
dependencies = [
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "jsonschema>=4.23",
    "packaging>=24.0",
    "pathspec>=0.12",
    "pillow>=11.0",
    "pydantic>=2.11",
    "pygments>=2.18",
    "pyyaml>=6.0",
    "rich>=13.0",
    "textual>=8.2.8",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest==9.1.0", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/erp_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "colorama==0.4.6",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.19",
    "jsonschema-specifications==2025.9.1",
    "jsonschema==4.26.0",
    "linkify-it-py==2.2.0",
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.6.1",
    "mdurl==0.1.2",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pillow==12.3.0",
    "platformdirs==4.11.7",
    "pydantic_core==2.46.5",
    "pydantic==2.13.5",
    "Pygments==2.21.0",
    "PyYAML==6.0.3",
    "referencing==0.37.0",
    "rich==15.0.0",
    "rpds-py==2026.6.3",
    "shellingham==1.5.4",
    "socksio==1.0.0",
    "textual==8.2.8",
    "typer==0.27.2",
    "typing_extensions==4.16.0",
    "typing-inspection==0.4.4",
 ]

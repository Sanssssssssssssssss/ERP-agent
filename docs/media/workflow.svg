<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">From business intent to a verified Odoo result</title>
  <desc id="desc">A schematic, not a recording: the Pi session prepares native tools, the user approves each write, the native runtime calls Odoo, and the workbench reads back the result. ERP-Bench separately scores benchmark tasks. Animation is decorative.</desc>
  <style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m0 0 7 3.5L0 7" fill="none" stroke="#9cafa7"/></marker></defs>
  <rect width="1200" height="360" rx="20" fill="#f4f6f3"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#203b39">
    <text x="34" y="38" font-size="12" letter-spacing="2" fill="#647b74">EXECUTION FLOW</text>
    <text x="34" y="77" font-size="26" font-weight="600">Every write has a decision. Every result has a source.</text>
    <g fill="white" stroke="#cedcd3"><rect x="34" y="112" width="198" height="106" rx="12"/><rect x="268" y="112" width="198" height="106" rx="12"/><rect x="502" y="112" width="198" height="106" rx="12"/><rect x="736" y="112" width="198" height="106" rx="12"/><rect x="970" y="112" width="198" height="106" rx="12"/></g>
    <g stroke="#9cafa7" fill="none" marker-end="url(#arrow)"><path d="M232 165h30"/><path d="M466 165h30"/><path d="M700 165h30"/><path d="M934 165h30"/></g>
    <g font-size="11" fill="#147d75" letter-spacing="1.5"><text x="52" y="138">01 / INTENT</text><text x="286" y="138">02 / PLAN</text><text x="520" y="138">03 / APPROVE</text><text x="754" y="138">04 / EXECUTE</text><text x="988" y="138">05 / READ BACK</text></g>
    <g font-size="20" font-weight="600"><text x="52" y="171">Business task</text><text x="286" y="171">Pi session</text><text x="520" y="171">Your decision</text><text x="754" y="171">Odoo 19</text><text x="988" y="171">Result + trace</text></g>
    <g font-size="13" fill="#647b74"><text x="52" y="196">Conversation · CSV / TXT</text><text x="286" y="196">Native tools · context</text><text x="520" y="196">Review each ERP write</text><text x="754" y="196">Native runtime call</text><text x="988" y="196">State · receipts · usage</text></g>
    <path d="M835 218v50H551" fill="none" stroke="#9cafa7" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
    <rect x="34" y="246" width="510" height="76" rx="12" fill="#e9efea"/>
    <text x="52" y="275" font-size="17" font-weight="600">ERP-Bench</text><text x="176" y="275" font-size="13" fill="#54706b">Independent scoring for benchmark tasks</text>
    <text x="52" y="300" font-size="13" fill="#647b74">Reads final Odoo state; separate from desktop readback.</text>
    <text x="966" y="316" font-size="11" fill="#647b74">SCHEMATIC · NOT A LIVE RUN</text>
  </g>
  <g class="motion" fill="#147d75">
    <circle r="4"><animateMotion dur="8s" repeatCount="indefinite" path="M52 226H1160"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="8s" repeatCount="indefinite"/></circle>
    <rect x="502" y="112" width="198" height="106" rx="12" fill="none" stroke="#147d75" stroke-width="2"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.35;0.5;0.65;1" dur="8s" repeatCount="indefinite"/></rect>
  </g>
</svg>

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pi-agent-python"
version = "0.1.0"
description = "An unofficial Python implementation of Pi's coding-agent behavior."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "jsonschema>=4.23",
    "mcp==2.0.0",
    "mcp-types==2.0.0",
    "packaging>=24.0",
    "pathspec>=0.12",
    "pillow>=11.0",
    "pydantic>=2.11",
    "pygments>=2.18",
    "pyyaml>=6.0",
    "rich>=13.0",
    "textual>=8.2.8",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Sanssssssssssssssss/pi-agent-python"
Documentation = "https://github.com/Sanssssssssssssssss/pi-agent-python#readme"
Repository = "https://github.com/Sanssssssssssssssss/pi-agent-python"
Issues = "https://github.com/Sanssssssssssssssss/pi-agent-python/issues"
"Upstream Tau" = "https://github.com/huggingface/tau"
"Pi reference" = "https://github.com/badlogic/pi-mono"

[project.scripts]
pi-agent = "pi_coding.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_ai", "src/pi_agent", "src/pi_coding"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pi_ai", "pi_agent", "pi_coding"]

[[tool.mypy.overrides]]
module = "pygments.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

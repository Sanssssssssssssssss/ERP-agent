# Hard high-volume repair task where the primary workcenter path goes down.
objective_kind = "repair_plan"
difficulty = "hard"
available_routes = "buy_and_manufacture"

[repair]
kind = "workcenter_outage"

[customers]
count_range = [10, 12]
deadline_range = [8, 12]
demand_range = [15, 26]

[supply]
stock_ratio_range = [0.04, 0.1]
finished_vendor_target_range = [4, 5]
finished_vendor_limit = 6
include_components = true
component_count_range = [4, 6]
component_vendor_category_count_range = [3, 3]
vendor_capacity_primary_ratio_range = [0.07, 0.24]
sampling_tightness = 0.62

[order_acceptance]
mode = "accept_all_orders"

[manufacture]
bom_structure = "single_bom"
workcenter_count = 3
workcenter_choice_path = "split_by_capacity"
assembly_capacity_buffer_range = [0, 1]
assembly_capacity_ratio_range = [0.18, 0.32]

[export]
product_domain = "solar_panels"
include_adjacent_data = true

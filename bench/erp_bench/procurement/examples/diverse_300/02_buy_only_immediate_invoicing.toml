# Buy-only with immediate invoicing.
difficulty = "easy"
available_routes = "buy_only"
objective_kind = "constraint_only"

[customers]
count_range = [4, 4]
deadline_range = [5, 9]
demand_range = [1, 11]

[supply]
stock_ratio_range = [0.75, 0.92]
finished_vendor_target_range = [3, 3]
finished_vendor_limit = 4
include_components = false
component_vendor_category_count_range = [1, 1]
vendor_capacity_primary_ratio_range = [0.4, 0.9]
sampling_tightness = 0.25

[order_acceptance]
mode = "accept_all_orders"

[invoicing]
required = true
payment_term = "immediate"

[export]
product_domain = "server_racks"
include_adjacent_data = true

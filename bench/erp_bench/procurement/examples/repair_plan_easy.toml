# Easy buy-only repair task where a committed supplier offer is canceled.
objective_kind = "repair_plan"
difficulty = "easy"
available_routes = "buy_only"

[repair]
kind = "supplier_cancellation"

[customers]
count_range = [4, 4]
deadline_range = [6, 9]
demand_range = [4, 10]

[supply]
stock_ratio_range = [0.08, 0.18]
finished_vendor_target_range = [3, 3]
finished_vendor_limit = 4
include_components = false
component_vendor_category_count_range = [1, 1]
vendor_capacity_primary_ratio_range = [0.35, 0.6]
sampling_tightness = 0.25

[order_acceptance]
mode = "accept_all_orders"

[export]
product_domain = "sound_panels"
include_adjacent_data = true

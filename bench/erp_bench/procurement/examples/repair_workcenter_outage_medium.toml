# Medium manufacture-or-buy repair task where a committed workcenter path goes down.
objective_kind = "repair_plan"
difficulty = "medium"
available_routes = "buy_and_manufacture"

[repair]
kind = "workcenter_outage"

[customers]
count_range = [5, 7]
deadline_range = [7, 11]
demand_range = [8, 18]

[supply]
stock_ratio_range = [0.08, 0.2]
finished_vendor_target_range = [2, 3]
finished_vendor_limit = 4
include_components = true
component_count_range = [2, 4]
component_vendor_category_count_range = [2, 3]
vendor_capacity_primary_ratio_range = [0.16, 0.42]
sampling_tightness = 0.45

[order_acceptance]
mode = "accept_all_orders"

[manufacture]
bom_structure = "single_bom"
workcenter_count = 2
workcenter_choice_path = "split_by_capacity"
assembly_capacity_buffer_range = [0, 1]
assembly_capacity_ratio_range = [0.24, 0.42]

[export]
product_domain = "led_fixtures"
include_adjacent_data = true
